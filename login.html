
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - Nexora University</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="auth-page-body">

    <main class="auth-page">

        <div class="auth-top">

            <a href="index.html" class="auth-brand">
                <span class="auth-brand-mark">N</span>

                <span>
                    <b>Nexora University</b>
                    <small>Admission Application Portal</small>
                </span>
            </a>

            <a href="index.html" class="auth-back">← Home</a>

        </div>

        <section class="auth-card">

            <div class="auth-heading">
                <div class="auth-icon">🎓</div>

                <h1 id="authTitle">Student Login</h1>

                <p id="authSubtitle">
                    Login to continue your admission application.
                </p>
            </div>

            <div class="auth-tabs">

                <button type="button" id="showLoginTab"
                    class="active" onclick="showLogin()">
                    Login
                </button>

                <button type="button" id="showRegisterTab"
                    onclick="showRegister()">
                    Register
                </button>

            </div>

            <form id="studentLoginForm" class="auth-form">

                <label for="studentLoginEmail">Email</label>

                <input type="email" id="studentLoginEmail"
                    placeholder="Enter your email"
                    autocomplete="username" required>

                <label for="studentLoginPassword">Password</label>

                <input type="password" id="studentLoginPassword"
                    placeholder="Enter your password"
                    autocomplete="current-password" required>

                <button type="submit" class="primary-btn">
                    Login
                </button>

            </form>

            <form id="studentRegisterForm"
                class="auth-form hidden">

                <label for="studentRegisterName">Full Name</label>

                <input type="text" id="studentRegisterName"
                    placeholder="Enter your full name"
                    autocomplete="name" required>

                <label for="studentRegisterEmail">Email</label>

                <input type="email" id="studentRegisterEmail"
                    placeholder="Enter your email"
                    autocomplete="email" required>

                <label for="studentRegisterPassword">Password</label>

                <input type="password" id="studentRegisterPassword"
                    placeholder="Minimum 8 characters"
                    minlength="8" autocomplete="new-password" required>

                <button type="submit" class="primary-btn">
                    Create Account
                </button>

            </form>

            <p id="authMessage" class="auth-message"
                aria-live="polite"></p>

            <div class="auth-note">
                Create a student account or login with your
                registered email and password.
            </div>

        </section>

    </main>

    <script src="auth-page.js"></script>

</body>
</html>
